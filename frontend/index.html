<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Chat App (Tugas TST)</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-container { height: calc(100vh - 180px); }
    </style>
</head>
<body class="bg-gray-100 font-sans">

<div id="app" class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative">

    <div v-if="!isLoggedIn" class="p-8 flex flex-col justify-center h-screen">
        <h1 class="text-3xl font-bold text-blue-600 mb-6 text-center">🔐 Secure Chat</h1>
        
        <input v-model="loginForm.username" type="text" placeholder="Username" class="border p-3 rounded mb-3 w-full">
        <input v-model="loginForm.password" type="password" placeholder="Password" class="border p-3 rounded mb-3 w-full">
        
        <button @click="doLogin" class="bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-700 transition">
            MASUK / LOGIN
        </button>
        <p class="text-xs text-gray-500 mt-4 text-center">Menggunakan API Auth Teman</p>
    </div>

    <div v-else>
        <div class="bg-blue-600 p-4 text-white flex justify-between items-center shadow">
            <div>
                <h2 class="font-bold text-lg">{{ user.username }}</h2>
                <p class="text-xs opacity-80">ID: {{ user.id }}</p>
            </div>
            <button @click="logout" class="text-sm bg-red-500 px-3 py-1 rounded">Logout</button>
        </div>

        <div class="chat-container overflow-y-auto p-4 space-y-3 bg-gray-50">
            <div v-for="msg in messages" :key="msg.id" 
                 :class="{'text-right': msg.senderId === user.id, 'text-left': msg.senderId !== user.id}">
                
                <div class="inline-block p-3 rounded-lg max-w-[80%]"
                     :class="msg.senderId === user.id ? 'bg-blue-100 text-blue-900' : 'bg-white border text-gray-800'">
                    
                    <p class="font-bold text-xs mb-1">{{ msg.senderId === user.id ? 'Saya' : 'Teman' }}</p>
                    
                    <p v-if="msg.isDecrypted">{{ msg.content }}</p>
                    <p v-else class="italic text-gray-400 text-xs break-all">
                        🔒 {{ msg.content }} 
                        <button @click="decryptMessage(msg)" class="ml-2 text-blue-600 underline font-bold">Buka</button>
                    </p>
                    
                    <span class="text-[10px] text-gray-400 block mt-1 text-right">{{ formatDate(msg.timestamp) }}</span>
                </div>
            </div>
        </div>

        <div class="absolute bottom-0 w-full bg-white p-3 border-t flex gap-2">
            <input v-model="newMessage" type="text" placeholder="Ketik pesan rahasia..." class="flex-1 border p-2 rounded">
            <button @click="sendMessage" class="bg-green-600 text-white px-4 rounded font-bold">➤</button>
        </div>
    </div>

</div>

<script>
    const { createApp } = Vue

    createApp({
        data() {
            return {
                // CONFIG API 
                apiHakim: 'https://hakim.tugastst.my.id', 
                apiRadit: 'https://radit.tugastst.my.id', 
                secretKey: '12345678901234567890123456789012', // Hardcode Key 

                isLoggedIn: false,
                user: null, // Data user yg sedang login
                
                loginForm: { username: '', password: '' },
                newMessage: '',
                
                // Dummy Data Chat (Nanti diganti API History)
                messages: []
            }
        },
        methods: {
            async doLogin() {
                // 1. Tembak API Hakim (/auth/login)
                try {
                    if(this.loginForm.username) {
                        this.user = { id: 'user-123', username: this.loginForm.username }
                        this.isLoggedIn = true
                        alert("Login Mockup Berhasil! Nanti kita sambung API Hakim.")
                    } else {
                        alert("Isi username dulu")
                    }

                } catch (e) {
                    alert('Error koneksi: ' + e)
                }
            },

            async sendMessage() {
                if (!this.newMessage) return

                // STEP 1: ENKRIPSI (API Radit)
                try {
                    const resEncrypt = await fetch(`${this.apiRadit}/encrypt`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            text: this.newMessage,
                            key: this.secretKey
                        })
                    })
                    const dataEncrypt = await resEncrypt.json()
                    const cipherText = dataEncrypt.result

                    // STEP 2: KIRIM KE DB (API Hakim)
                    this.messages.push({
                        id: Date.now(),
                        senderId: this.user.id,
                        content: cipherText, 
                        isDecrypted: false,  
                        timestamp: new Date().toISOString()
                    })

                    this.newMessage = '' 

                } catch (e) {
                    alert("Gagal Enkripsi/Kirim: " + e)
                }
            },

            async decryptMessage(msg) {
                // STEP 3: DEKRIPSI (API Radit)
                try {
                    const res = await fetch(`${this.apiRadit}/decrypt`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            text: msg.content,
                            key: this.secretKey
                        })
                    })
                    const data = await res.json()
                    
                    msg.content = data.result
                    msg.isDecrypted = true

                } catch (e) {
                    alert("Gagal buka pesan: " + e)
                }
            },

            logout() {
                this.isLoggedIn = false
                this.user = null
                this.messages = []
            },
            
            formatDate(dateStr) {
                return new Date(dateStr).toLocaleTimeString()
            }
        }
    }).mount('#app')
</script>
</body>
</html>
